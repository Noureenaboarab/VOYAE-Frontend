<aside class="admin-sidebar" aria-label="Admin navigation">

  <!-- Brand -->
  <div class="admin-sidebar__brand">
    <span class="admin-sidebar__logo">VOY&#198;</span>
    <span class="admin-sidebar__role-label">Admin</span>
  </div>

  <!-- Store section -->
  <nav class="admin-sidebar__section" aria-label="Store">
    <p class="admin-sidebar__section-label">Store</p>
    <div class="admin-sidebar__nav">

      <a routerLink="/admin/products" routerLinkActive="is-active" class="admin-sidebar__nav-link">
        <!-- Products icon -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9"   y="1.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="1.5" y="9"   width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9"   y="9"   width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        Products
      </a>

      <a routerLink="/admin/orders" routerLinkActive="is-active" class="admin-sidebar__nav-link">
        <!-- Orders icon -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2" y="1.5" width="12" height="13" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <line x1="5" y1="5.5" x2="11" y2="5.5"  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="5" y1="8"   x2="11" y2="8"    stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="5" y1="10.5" x2="9" y2="10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Orders
      </a>

      <a routerLink="/admin/customers" routerLinkActive="is-active" class="admin-sidebar__nav-link">
        <!-- Customers icon -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="5.5" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M2 14.5c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Customers
      </a>

      <a routerLink="/admin/discounts" routerLinkActive="is-active" class="admin-sidebar__nav-link">
        <!-- Discounts icon -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M9 1.5H5.5L1.5 5.5V9l5.5 5.5 7.5-7.5L9 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="5.5" cy="5.5" r="1.25" fill="currentColor"/>
        </svg>
        Discounts
      </a>

    </div>
  </nav>

  <!-- Spacer pushes user to bottom -->
  <div class="admin-sidebar__spacer"></div>

  <!-- User profile -->
  <div class="admin-sidebar__user">
    <div class="admin-sidebar__avatar" aria-hidden="true">MD</div>
    <div class="admin-sidebar__user-info">
      <p class="admin-sidebar__user-name">Marc Dupont</p>
      <p class="admin-sidebar__user-role">Super Admin</p>
    </div>
    <button class="admin-sidebar__logout" aria-label="Log out">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 14H3a1 1 0 01-1-1V3a1 1 0 011-1h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M10.5 11L14 8l-3.5-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="14" y1="8" x2="6" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

</aside>
