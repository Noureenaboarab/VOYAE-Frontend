<div class="engine-page">
  <div class="engine-page__topbar">
    <div>
      <p class="eyebrow">System</p>
      <h1 class="display-md">Engine</h1>
    </div>
  </div>

  @if (state() === 'idle') {
    <div class="engine-page__center">
      <button class="fuzzy-btn" (click)="launch()">
        <span class="fuzzy-btn__label">TICK ENGINE</span>
        <span class="fuzzy-btn__noise"></span>
      </button>
    </div>
  }

  @if (state() === 'running') {
    <div class="engine-page__center">
      <div class="engine-page__spinner">
        <div class="engine-page__spinner-ring"></div>
        <span class="engine-page__spinner-label">Processing&hellip;</span>
      </div>
    </div>
  }

  @if (state() === 'complete' || state() === 'error') {
    <div class="engine-page__center">
      <div class="engine-page__result-box"
           [class.is-error]="state() === 'error'">
        <div class="engine-page__result-icon">{{ state() === 'complete' ? 'OK' : 'ERR' }}</div>
        <div class="engine-page__result-status">
          {{ state() === 'complete' ? 'Engine Tick Complete' : errorMessage() }}
        </div>
        <div class="engine-page__result-meta">
          <span>{{ duration() }} ms</span>
          <span>{{ completedAt() }}</span>
        </div>
        <button class="btn btn--secondary" (click)="reset()">Back</button>
      </div>
    </div>
  }
</div>
